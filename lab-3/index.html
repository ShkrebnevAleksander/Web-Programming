<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atolla</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;1,300&display=swap"
    />
  </head>
  <body>

    <!-- ========== HEADER ========== -->
    <header class="header">
      <div class="header__container">

        <a href="/" class="header__logo" aria-label="Atolla — home">
          <img
            src="assets/img/logo.png"
            alt="Atolla"
            class="header__logo-img"
            width="90"
            height="28"
          />
        </a>

        <nav class="header__nav" aria-label="Main navigation">
          <ul class="nav__list">
            <li class="nav__item"><a href="#" class="nav__link">Products</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Plans</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Ingredients</a></li>
            <li class="nav__item"><a href="#" class="nav__link">How It Works</a></li>
            <li class="nav__item"><a href="#" class="nav__link">About</a></li>
            <li class="nav__item"><a href="#" class="nav__link">Blog</a></li>
          </ul>
        </nav>

        <div class="header__auth">
          <a href="#" class="btn btn--primary">Get Started</a>
          <a href="#" class="btn btn--secondary">Sign In</a>
        </div>

      </div>
    </header>

    <!-- ========== HERO ========== -->
    <div class="section-wrapper">
      <section class="hero">
        <div class="hero__container">
          <div class="hero__content">
            <p class="hero__eyebrow">Get Summer Skincare Ready</p>
            <h1 class="hero__headline">Custom formulas to support your unique needs.</h1>
          </div>
          <a href="#" class="hero__cta">Take the Quiz</a>
        </div>
      </section>
    </div>

    <!-- ========== BADGES ========== -->
    <div class="section-wrapper">
      <section class="badges" aria-label="Brand values">
        <div class="badges__list">
          <span class="badges__item">Vegan</span>
          <span class="badges__item">Cruelty-Free</span>
          <span class="badges__item">Allergy Friendly</span>
          <span class="badges__item">Responsibly Famed</span>
          <span class="badges__item">No Added Fragrance</span>
        </div>
      </section>
    </div>

    
  </body>
</html>
